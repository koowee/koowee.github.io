# One-off probe: can a GitHub runner read levi.fi slope status without browser headers?
# Step 1 showed the API answers 401 without an Origin header. Step 2: is the status already in the public page HTML?
# We send no Origin and no fake headers. Remove this file after the probe.
name: Levi status probe
on:
  push:
    branches: [claude/levi-status-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Public pages
        run: |
          for u in https://www.levi.fi/laskettelu-ja-hiihto/rinteet-ja-hissit/ https://www.levi.fi/laskettelu-ja-hiihto/maastohiihto/; do
            code=$(curl -sL -A 'koowee-levi-map-probe' -o page.html -w '%{http_code}' "$u")
            echo "== $u -> HTTP $code, $(wc -c < page.html) bytes"
            echo "frends mentions: $(grep -o 'frendsapp[^"'"'"' ]*' page.html | sort -u | head -5 | tr '\n' ' ')"
            echo "status words: Avaustavoite=$(grep -c 'Avaustavoite' page.html) E.1=$(grep -o 'E\.1' page.html | wc -l) Express gondoli=$(grep -o 'Express gondoli' page.html | wc -l) operating=$(grep -o '"operating"' page.html | wc -l)"
            grep -o '<script[^>]*src="[^"]*"' page.html | head -15
            grep -oi 'hubdb[^"]*' page.html | sort -u | head -5
          done
